<div class="counter">
    <h2>${this.count.value}</h2>
    <div class="buttons">
        <button @click=${this.decrement} class="btn-decrement">-</button>
        <button @click=${this.increment} class="btn-increment">+</button>
        <button @click=${this.reset} class="btn-reset">Reset</button>
    </div>
</div>
